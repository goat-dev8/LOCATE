[package]
name = "locate"
version = "0.1.0"
description = "LOCATE: time-and-delivery lending of Token-2022 PreStocks against USDC collateral"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "locate"

[features]
default = ["mainnet"]
mainnet = []
devnet = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "1.2.0", features = ["event-cpi", "init-if-needed"] }
anchor-spl = { version = "1.2.0", features = ["token", "token_2022", "token_2022_extensions", "associated_token", "memo"] }

[dev-dependencies]
litesvm = "0.16.0"
proptest = "1.6"
